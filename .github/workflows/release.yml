# Release: triggered by pushing a `v*` tag (e.g. `v2.0.0`).
# Builds the extension, publishes release/release.zip as a GitHub Release asset,
# AND auto-uploads to the Chrome Web Store (publishing a new version for review).
#
# CWS upload uses chrome-webstore-upload-cli (fregante) with 5 secrets
# (Settings → Secrets → Actions):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET,
#   CWS_REFRESH_TOKEN, CWS_PUBLISHER_ID
# See CONTRIBUTING / onboarding docs for how to obtain them.
#
# The verify gate mirrors CI (ci.yml) exactly — type-check, lint, unit tests,
# AND the LUFS accuracy (golden-reference) suite. A release must never pass a
# weaker bar than a PR merge; the eval suite in particular catches K-weighting
# regressions that unit tests miss.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full gate before publishing — never ship a build that doesn't pass.
      # This MUST match CI: type-check → lint → unit → LUFS accuracy → build.
      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Golden-reference regression for the LUFS meter. See ci.yml for why this
      # is a hard gate: it checks LufsCalculator against closed-form analytic
      # truth (amplitude linearity, K-weighting response, absolute anchors),
      # not against another implementation. A subtle K-weighting break
      # passes unit tests but fails here.
      - name: LUFS accuracy suite (golden reference)
        run: pnpm test:eval

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        # GITHUB_REF_NAME is the tag ("v2.0.0"); strip the leading "v" so we
        # can build a clean RELEASE_NOTES-v2.0.0.md path below.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with release.zip
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          # Prefer a curated RELEASE_NOTES-V<version>.md if present (richer than
          # the auto-generated PR list); fall back to GitHub's auto notes.
          body_path: RELEASE_NOTES-v${{ steps.version.outputs.version }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/release.zip

      # Upload the artifact so the publish-cws job can fetch it without rebuilding.
      - name: Upload release.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: release/release.zip

  publish-cws:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Download release.zip
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release

      # Upload + publish via chrome-webstore-upload-cli (fregante, 497 stars,
      # actively maintained). Handles OAuth token refresh, IN_PROGRESS polling,
      # retries, and error reporting. The upload submits the new version for
      # Google review; it does NOT go live until approved.
      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: npx chrome-webstore-upload-cli@4 upload --source release/release.zip --auto-publish
