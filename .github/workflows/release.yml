# Release: triggered by pushing a `v*` tag (e.g. `v2.0.0`).
# Builds the extension, publishes release/release.zip as a GitHub Release asset,
# AND auto-uploads to the Chrome Web Store (publishing a new version for review).
#
# CWS upload uses 4 secrets (Settings → Secrets → Actions):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
# See CONTRIBUTING / onboarding docs for how to obtain them.
#
# The verify gate mirrors CI (ci.yml) exactly — type-check, lint, unit tests,
# AND the LUFS accuracy (golden-reference) suite. A release must never pass a
# weaker bar than a PR merge; the eval suite in particular catches K-weighting
# regressions that unit tests miss.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full gate before publishing — never ship a build that doesn't pass.
      # This MUST match CI: type-check → lint → unit → LUFS accuracy → build.
      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Golden-reference regression for the LUFS meter. See ci.yml for why this
      # is a hard gate: it checks LufsCalculator against closed-form analytic
      # truth (amplitude linearity, K-weighting response, absolute anchors),
      # not against another implementation. A subtle K-weighting break
      # passes unit tests but fails here.
      - name: LUFS accuracy suite (golden reference)
        run: pnpm test:eval

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        # GITHUB_REF_NAME is the tag ("v2.0.0"); strip the leading "v" so we
        # can build a clean RELEASE_NOTES-v2.0.0.md path below.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with release.zip
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          # Prefer a curated RELEASE_NOTES-V<version>.md if present (richer than
          # the auto-generated PR list); fall back to GitHub's auto notes.
          body_path: RELEASE_NOTES-v${{ steps.version.outputs.version }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/release.zip

      # Upload the artifact so the publish-cws job can fetch it without rebuilding.
      - name: Upload release.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: release/release.zip

  publish-cws:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Download release.zip
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release

      # Upload to Chrome Web Store via the official Publish API (no third-party
      # CLI — just curl). Three steps: refresh the access token, upload the zip,
      # then publish. The "publish" call submits the new version for Google
      # review; it does NOT go live until approved.
      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -e
          # 1. Exchange refresh token for an access token.
          TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to obtain access token"
            exit 1
          fi
          echo "✅ Access token obtained"

          # 2. Upload the zip (PUT to update an existing item; needs ?uploadType=media).
          UPLOAD=$(curl -s -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T "release/release.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID?uploadType=media")
          echo "Upload response: $UPLOAD"
          # Check for API-level errors first (403 accessNotConfigured, etc.)
          ERR=$(echo "$UPLOAD" | jq -r '.error.message // empty')
          if [ -n "$ERR" ]; then
            echo "❌ Upload failed: $ERR"
            exit 1
          fi
          STATE=$(echo "$UPLOAD" | jq -r '.uploadState // empty')
          if [ "$STATE" = "FAILURE" ]; then
            echo "❌ Upload failed: $(echo "$UPLOAD" | jq -r '.itemError[0].errorDetail')"
            exit 1
          fi
          echo "✅ Uploaded (state: ${STATE:-OK})"

          # 3. Publish — submit the new version for review.
          PUB=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "Publish response: $PUB"
          PUB_ERR=$(echo "$PUB" | jq -r '.error.message // empty')
          if [ -n "$PUB_ERR" ]; then
            echo "❌ Publish failed: $PUB_ERR"
            exit 1
          fi
          echo "✅ Published — new version submitted for review"
